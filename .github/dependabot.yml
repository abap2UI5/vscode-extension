# Monthly dependency updates, opened as pull requests so `npm test`, the
# typecheck and the web smoke decide whether they are safe.
#
# @abap2ui5/linter is deliberately NOT here. It is a git dependency pinned to
# a commit, and bump-linter.yml already owns it: once a week that workflow
# re-resolves the pin against the linter's main, runs the full gate, and opens
# a pull request only if it passed. Letting Dependabot bump it too would mean
# two pull requests for one decision, and the one without the gate run would
# be the one that looks simpler to merge.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      # Monthly runs land on the 1st, so a bump no longer reliably follows the
      # Monday lockfile settle from bump-linter.yml the way the old Tuesday
      # slot did. A collision costs a rebase, not a build.
      time: "06:30"
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors, until typescript-eslint can take one. Its peer range
      # is `>=4.8.4 <6.1.0` as of 8.67.0 - which is the newest there is - so a
      # major bump here does not produce a red test, it produces an `npm ci`
      # that cannot resolve at all, and every job in the workflow is skipped
      # rather than run. That happened on 2026-08-18 with 5.3 -> 7.0.2, and it
      # reached main because a red pull request can be merged in this
      # repository.
      #
      # Lift this the day `npm view typescript-eslint peerDependencies.typescript`
      # admits the major - not before, and not by deleting the line because it
      # looks stale.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@abap2ui5/linter"
      # The @types/vscode RANGE is coupled to engines.vscode: `vsce package`
      # compares the two strings and refuses a types range newer than the
      # engine floor, so a bump here does not produce a red test, it produces
      # an unpackageable extension (bit us on 2026-09-01: ^1.134.0 against
      # engines ^1.101.0 broke `npm run vsix` on main). The range stays at the
      # engine floor and moves only WITH engines.vscode - by hand, as one
      # commit. The lockfile may still resolve a newer .d.ts inside the range.
      - dependency-name: "@types/vscode"
    groups:
      toolchain:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      toolchain-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
