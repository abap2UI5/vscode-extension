# Monthly dependency updates, opened as pull requests so `npm test`, the
# typecheck and the web smoke decide whether they are safe.
#
# @abap2ui5/linter is deliberately NOT here. It is a git dependency pinned to
# a commit, and bump-linter.yml already owns it: once a week that workflow
# re-resolves the pin against the linter's main, runs the full gate, and opens
# a pull request only if it passed. Letting Dependabot bump it too would mean
# two pull requests for one decision, and the one without the gate run would
# be the one that looks simpler to merge.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      # Monthly runs land on the 1st, so a bump no longer reliably follows the
      # Monday lockfile settle from bump-linter.yml the way the old Tuesday
      # slot did. A collision costs a rebase, not a build.
      time: "06:30"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@abap2ui5/linter"
    groups:
      toolchain:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      toolchain-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:30"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
