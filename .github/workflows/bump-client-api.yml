# src/data/client-api.json is generated from the core's z2ui5_if_client
# interface but lives in this repo - the one bundled artefact with no drift
# gate until now (the UI5 snapshot moves with the linter pin, the snippets
# are tested; the client API hover was synced by hand). This workflow closes
# that gap: weekly regenerate against the core's main, full gate, PR. A red
# run here means hover/completion currently describe an API the core no
# longer has.
#
# The mechanics live in bump-snapshot.yml, shared with the other three bumps.

name: Bump client API

on:
  schedule:
    # Mondays 06:41 UTC - after the 06:17 linter bump, off the full-hour spikes.
    - cron: "41 6 * * 1"
  workflow_dispatch:
  # Fired by the upstream repository when a relevant change merges, so the
  # bump lands the same day instead of waiting for the weekly schedule
  # (send a repository_dispatch with this event type via the GitHub API).
  repository_dispatch:
    types: [bump-client-api]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: ./.github/workflows/bump-snapshot.yml
    secrets: inherit
    with:
      label: src/data/client-api.json
      timeout-minutes: 30
      paths: src/data/client-api.json
      regenerate: node scripts/generate-client-api.mjs
      branch: bump-client-api
      title: "chore: sync client-api.json with the core's z2ui5_if_client"
      body: |
        Weekly regeneration of `src/data/client-api.json` from
        `abap2UI5/abap2UI5` main - the `client->` hover and completion
        describe the interface as it is documented upstream only when
        this file moves with it.
