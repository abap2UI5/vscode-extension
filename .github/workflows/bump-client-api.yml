# src/data/client-api.json is generated from the core's z2ui5_if_client
# interface but lives in this repo - the one bundled artefact with no drift
# gate until now (the UI5 snapshot moves with the linter pin, the snippets
# are tested; the client API hover was synced by hand). This workflow closes
# that gap the same way bump-linter does: weekly regenerate against the
# core's main, full gate, PR. A red run here means hover/completion currently
# describe an API the core no longer has.

name: Bump client API

on:
  schedule:
    # Mondays 06:41 UTC - after the 06:17 linter bump, off the full-hour spikes.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate from the core's main
        run: node scripts/generate-client-api.mjs

      - name: Check whether the interface knowledge moved
        id: diff
        run: |
          if git diff --quiet src/data/client-api.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        run: npm ci
      - if: steps.diff.outputs.changed == 'true'
        run: npm run lint
      - if: steps.diff.outputs.changed == 'true'
        run: npm test

      - if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bump-client-api
          title: "chore: sync client-api.json with the core's z2ui5_if_client"
          commit-message: "chore: sync client-api.json with the core's z2ui5_if_client"
          body: |
            Weekly regeneration of `src/data/client-api.json` from
            `abap2UI5/abap2UI5` main - the `client->` hover and completion
            describe the interface as it is documented upstream only when
            this file moves with it.

            Lint and tests ran on the regenerated data in the workflow that
            opened this PR; CI repeats them here.
          add-paths: |
            src/data/client-api.json
          delete-branch: true
