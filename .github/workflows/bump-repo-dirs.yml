# src/data/repo-dirs.json is a snapshot of abap2UI5/mcp-server's
# lib/repo-dirs.json - the directory names a sibling checkout can carry, which
# is what the MCP registration, the local view-check fallback and the example
# catalogues all probe a repos root with. The MCP server owns that list
# because it is the component that RESOLVES the root; this extension used to
# keep a hand-written second copy in src/repolayout.ts, with no gate between
# them, so the next repository rename would have landed in one of the two and
# half-worked.
#
# This workflow is the other half of that fix: weekly regenerate against
# mcp-server's main, full gate, PR. A red run here means the extension is
# looking for a checkout under a name the server has stopped using, or is
# missing one it added.
#
# The mechanics live in bump-snapshot.yml, shared with the other three bumps.

name: Bump repo dirs

on:
  schedule:
    # Mondays 07:05 UTC - after the app-template bump (06:53), off the
    # full-hour spikes.
    - cron: "5 7 * * 1"
  workflow_dispatch:
  # Fired by the upstream repository when a relevant change merges, so the
  # bump lands the same day instead of waiting for the weekly schedule
  # (send a repository_dispatch with this event type via the GitHub API).
  repository_dispatch:
    types: [bump-repo-dirs]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: ./.github/workflows/bump-snapshot.yml
    secrets: inherit
    with:
      label: src/data/repo-dirs.json
      timeout-minutes: 30
      paths: src/data/repo-dirs.json
      regenerate: node scripts/generate-repo-dirs.mjs
      branch: bump-repo-dirs
      title: "chore: sync repo-dirs.json with abap2UI5/mcp-server"
      body: |
        Weekly regeneration of `src/data/repo-dirs.json` from
        `abap2UI5/mcp-server` main - the extension finds the same sibling
        checkouts the MCP server does only when this file moves with it.

        Read the diff before merging: a new entry means a repository was
        renamed, and the old name has to stay in the list or every existing
        checkout stops being found.
