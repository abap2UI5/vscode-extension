name: Release

# Two ways to release, both ending in a tagged GitHub release with the
# .vsix attached — and, when the tokens are configured as secrets, the
# same .vsix published to the VS Code Marketplace (VSCE_PAT) and Open VSX
# (OVSX_PAT):
#
#   - Actions → Release → "Run workflow": tags the current commit with
#     v<version from package.json> and releases it.
#   - git tag v0.8.0 && git push origin v0.8.0
#
# Either way the tag and package.json have to agree, so a release is
# always reproducible from its tag.
#
# ---------------------------------------------------------------------------
# One-time setup before the first published release - neither step can be
# done from here, and both fail late (after the GitHub release exists) if
# they are missing:
#
#   VS Code Marketplace
#     1. Create the publisher `abap2ui5` on marketplace.visualstudio.com
#        (it has to match `publisher` in package.json exactly - a publisher
#        ID cannot be renamed afterwards).
#     2. Azure DevOps -> User settings -> Personal Access Tokens: a token
#        for ALL accessible organizations, scope "Marketplace -> Manage".
#        Store it as the repository secret VSCE_PAT.
#
#   Open VSX
#     1. Sign in on open-vsx.org with GitHub and create an access token.
#     2. Claim the namespace ONCE - publishing into a namespace that does
#        not exist fails. With the ovsx version this workflow pins
#        (OVSX_VERSION below), not whatever the registry serves today; ovsx
#        reads the token from OVSX_PAT:
#           OVSX_PAT=<token> npx --yes ovsx@<OVSX_VERSION> create-namespace abap2ui5
#     3. Store the token as the repository secret OVSX_PAT.
#
# Each publish is skipped while its secret is unset, so a release without
# either account still produces a tagged GitHub release with the .vsix
# attached - and a release that reached only ONE marketplace is finished by
# re-running this workflow, which publishes the missing half and treats the
# other's "already exists" as done.
#
# ---------------------------------------------------------------------------
# Four jobs, because of what the token can do in each. The build runs
# `npm ci`, the tests and two VS Code downloads - hundreds of packages and
# their install scripts - and none of that needs to write to the repository.
# It used to run with a `contents: write` GITHUB_TOKEN that actions/checkout
# had persisted into .git/config, so every dependency in the tree could have
# pushed a tag or cut a release. Now `build` and `desktop` get a read token
# and keep it out of the checkout, `release` is the only job with
# `contents: write` and runs no npm at all - it downloads the .vsix the build
# uploaded, tags, and creates the release - and `publish` installs the tree
# again, read-only, for the pinned vsce (ovsx comes through npx at a pinned
# version) and the two marketplace tokens. Every step that writes names the
# token it uses; nothing gets one by being in the same job.
# ---------------------------------------------------------------------------
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      tagged: ${{ steps.meta.outputs.tagged }}
      vsix: ${{ steps.meta.outputs.vsix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes, so no token in .git/config for
          # `npm ci` and the tests to find.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # The same two caches ci.yml keeps: playwright's Chromium (fetched by
      # npm ci through @vscode/test-web's tree) and the VS Code web build
      # that `npm run test:web` downloads. Browser-sized downloads both.
      - name: Cache the playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Work out the test-host version to key the cache on
        id: hosts
        run: |
          node -e '
            const l = require("./package-lock.json");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `web=${l.packages["node_modules/@vscode/test-web"]?.version ?? "none"}\n`);
          '

      - name: Cache the VS Code web build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test-web
          key: vscode-test-web-${{ runner.os }}-${{ steps.hosts.outputs.web }}

      - name: Work out which tag to release
        id: meta
        env:
          # The checkout kept no credentials, so the tag lookup below gets
          # the (read) token by hand - the repository is public and the lookup
          # would work anonymously, but it should not depend on that staying so.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Started by a tag: it has to match the manifest.
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "::error::Tag $tag does not match package.json version $version"
              exit 1
            fi
          else
            # Started by hand: the manifest decides the tag.
            tag="v$version"
            origin="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # The peeled ref (^{}) is the COMMIT an annotated tag points at;
            # the plain ref would be the tag object, and a retry after an
            # annotated `git tag -a` compared that against the commit and
            # refused. A lightweight tag has no peeled ref: fall back.
            remote=$(git ls-remote --tags "$origin" "refs/tags/$tag^{}" | cut -f1)
            if [ -z "$remote" ]; then
              remote=$(git ls-remote --tags "$origin" "refs/tags/$tag" | cut -f1)
            fi
            # An existing tag on THIS commit is a retry of a run that got as
            # far as tagging - re-running after a marketplace token failed is
            # the expected way to finish such a release, so let it through.
            # Anywhere else it means the version was already released.
            if [ -n "$remote" ] && [ "$remote" != "$GITHUB_SHA" ]; then
              # Two different situations end up here, and only one of them
              # wants a version bump - so name both rather than assume.
              echo "Tag $tag exists on ${remote:0:12}, this run is on ${GITHUB_SHA:0:12}."
              echo "If that release only reached ONE marketplace, do not re-release: publish the"
              echo "missing half from the .vsix that was actually released, so both marketplaces"
              echo "carry identical bytes for $tag -"
              echo "    gh release download $tag --pattern '*.vsix'"
              echo "    OVSX_PAT=<token> npx --yes ovsx@1.2.0 publish abap2ui5-$version.vsix   # or: npx vsce publish --packagePath ..."
              echo "Otherwise this is a new release: bump the version in package.json and add a"
              echo "CHANGELOG.md section for it."
              echo "::error::$tag is already released from commit ${remote:0:12} - releasing it again from here would publish different content under a version that is already out"
              exit 1
            fi
            if [ -n "$remote" ]; then
              echo "::notice::$tag already points at this commit - continuing as a retry"
            fi
            echo "tagged=$remote" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "vsix=abap2ui5-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - run: npm ci
      - run: npm run lint
      # A tag can point at a commit CI never saw - the suite runs here too,
      # so a release is never built from a tree the tests have not judged.
      - run: npm test
      - run: npm run vsix

      # ...and that argument applies hardest to the web bundle, which is the
      # one thing neither `npm test` nor `npm run vsix` says anything about:
      # they would both pass on a build that throws at load in a browser
      # host. This used to be the single CI step a release skipped, on
      # exactly the path the comment above worries about.
      #
      # It matters here more than anywhere: the main consumer of the Open VSX
      # publish below is SAP Business Application Studio, which IS a web host.
      # A broken web bundle reaches those users through this workflow and
      # nothing else.
      #
      # AGENTS.md's "may not run in restricted environments" caveat is about
      # the sandboxed pre-push loop - this runner has full network, so the
      # VS Code web and Chromium downloads it needs are fine.
      #
      # Ordered after `npm run vsix` deliberately: it writes dist/web/test.js
      # into the directory the package is built from. `.vscodeignore` excludes
      # that file, so this is belt and braces rather than the only thing
      # keeping the test bundle out of a published release - which is what it
      # was before.
      - run: npm run test:web

      # The .vsix the release job attaches, so the bytes that were tested are
      # the bytes that ship - the release job builds nothing.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.vsix }}
          path: ${{ steps.meta.outputs.vsix }}
          if-no-files-found: error

  # The desktop half of the same question the web smoke test answers, and the
  # one ci.yml gate a release still skipped: `src/extension.ts`, the Session
  # wiring and `dist/properties.json` resolved next to the packaged bundle
  # only prove themselves in a real VS Code. Same job as ci.yml's `desktop`,
  # step for step, so the two cannot drift apart.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Cache the playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ms-playwright-${{ runner.os }}-

      - name: Work out the test-host version to key the cache on
        id: hosts
        run: |
          node -e '
            const l = require("./package-lock.json");
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `electron=${l.packages["node_modules/@vscode/test-electron"]?.version ?? "none"}\n`);
          '

      # @vscode/test-electron downloads a full VS Code into ./.vscode-test.
      - name: Cache the VS Code desktop build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-electron-${{ runner.os }}-${{ steps.hosts.outputs.electron }}

      - run: npm ci

      # xvfb because Electron needs a display; ABAP2UI5_DESKTOP_TEST_REQUIRED
      # because the runner is allowed to skip itself in a restricted
      # environment and that must never quietly become true here.
      - name: Run the desktop smoke test
        env:
          ABAP2UI5_DESKTOP_TEST_REQUIRED: "1"
        run: xvfb-run -a npm run test:desktop

  # The only job that writes. No npm here: it needs the manifest's changelog
  # and the commit to tag, both of which the checkout has, and the .vsix,
  # which the build uploaded.
  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The one push below names its token itself (`Tag the commit`).
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.vsix }}

      # Only for a manual run - a tag-triggered run already has its tag.
      # Pushing with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop back into the tag trigger above.
      - name: Tag the commit
        if: github.event_name == 'workflow_dispatch' && needs.build.outputs.tagged == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          git tag "$TAG"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TAG"

      # Release notes come from the matching CHANGELOG.md section.
      - name: Collect the release notes
        run: |
          version="${{ needs.build.outputs.version }}"
          awk -v header="## $version" '
            $0 == header { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version - see CHANGELOG.md." > release-notes.md
          fi
          {
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "code --install-extension ${{ needs.build.outputs.vsix }}"
            echo '```'
            echo ""
            echo "Or: Extensions panel → \`…\` menu → **Install from VSIX…**"
          } >> release-notes.md

      # Idempotent on purpose. The marketplace publishes come after this job,
      # so a missing or expired token fails the run with the release already
      # created - and the fix for that is to re-run this workflow, which must
      # not then die on "release already exists". Re-running replaces the
      # asset and leaves the notes alone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG is already released - replacing the .vsix asset"
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --title "abap2UI5 ${{ needs.build.outputs.version }}" \
              --notes-file release-notes.md
          fi

  # The marketplaces get the same bytes the GitHub release carries. This job
  # needs node_modules again - for the pinned vsce, nothing else; ovsx is
  # fetched at its pinned version by npx - and gets the read token like the
  # build does; the only credentials it holds are the two marketplace tokens,
  # and only in the step that uses them.
  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Neither publisher needs a browser; this is the sandbox install from
      # AGENTS.md, for the same reason - nothing here runs a test.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.vsix }}

      # The secrets context is not reliably available in step-level `if`,
      # so turn "is the token configured" into step outputs first. A publish
      # step whose token is missing is skipped (with a notice), so a release
      # still works before the marketplace accounts exist.
      - name: Check which publish tokens are configured
        id: tokens
        run: |
          echo "vsce=${{ secrets.VSCE_PAT != '' }}" >> "$GITHUB_OUTPUT"
          echo "ovsx=${{ secrets.OVSX_PAT != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.VSCE_PAT != '' }}" != "true" ]; then
            echo "::notice::VSCE_PAT secret not configured - skipping the VS Code Marketplace publish"
          fi
          if [ "${{ secrets.OVSX_PAT != '' }}" != "true" ]; then
            echo "::notice::OVSX_PAT secret not configured - skipping the Open VSX publish"
          fi

      # The two publishes are independent, and either can fail on its own
      # credential - so each has to be re-runnable without the other standing
      # in the way. Neither marketplace lets a version be replaced, which
      # means the SECOND attempt meets "already exists" from the one that
      # succeeded the first time round, and the run dies before reaching the
      # one that did not. Treating "this exact version is already up there"
      # as the desired end state is what makes a half-published release
      # finishable: re-run, and only the missing half is actually published.
      #
      # Only that one message is swallowed. Every other failure - a bad
      # token, a missing namespace, a rejected manifest - still fails the run.
      - name: Publish the same .vsix to both marketplaces
        if: steps.tokens.outputs.vsce == 'true' || steps.tokens.outputs.ovsx == 'true'
        env:
          # Both CLIs read their token from the environment - vsce VSCE_PAT,
          # ovsx OVSX_PAT - so neither appears on a command line.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
          VSCE: ${{ steps.tokens.outputs.vsce }}
          OVSX: ${{ steps.tokens.outputs.ovsx }}
          OVSX_VERSION: "1.2.0"
        run: |
          # Runs one publish command, and reports whether the version is now
          # up there - by publishing it, or by having been there already.
          publish() {
            local what="$1"; shift
            local out status
            set +e
            out=$("$@" 2>&1); status=$?
            set -e
            printf '%s\n' "$out"
            if [ $status -ne 0 ] && printf '%s' "$out" | grep -qiE 'already (exists|published)'; then
              echo "::notice::$VSIX is already on $what - nothing to publish"
              return 0
            fi
            return $status
          }

          failed=

          # VSCE_PAT is an Azure DevOps personal access token for the
          # abap2ui5 publisher, scope "Marketplace → Manage", issued for ALL
          # accessible organizations - a token scoped to a single org is
          # rejected with TF400813, which reads like a permission problem on
          # the publisher and is not one.
          # https://code.visualstudio.com/api/working-with-extensions/publishing-extension
          if [ "$VSCE" = "true" ]; then
            publish "the VS Code Marketplace" npx vsce publish --packagePath "$VSIX" || failed="$failed marketplace"
          fi

          # Open VSX serves VSCodium, Theia and SAP Business Application
          # Studio. OVSX_PAT is a token from open-vsx.org; the `abap2ui5`
          # namespace has to exist first (`ovsx create-namespace`) and the
          # Eclipse publisher agreement has to be signed.
          # ovsx is pinned to an exact version HERE, not as a devDependency:
          # a publisher that resolved "whatever is latest" on release day was
          # the one unpinned piece of the toolchain - but in the tree it drags
          # a second @vscode/vsce (3.x) with an open advisory into every
          # contributor's `npm audit`, for a tool only this step runs. Bump
          # OVSX_VERSION by hand with a release of ovsx.
          # https://github.com/eclipse/openvsx/wiki/Publishing-Extensions
          if [ "$OVSX" = "true" ]; then
            publish "Open VSX" npx --yes "ovsx@$OVSX_VERSION" publish "$VSIX" || failed="$failed open-vsx"
          fi

          # Both are attempted before the job gives up, so one broken token
          # never hides the state of the other half.
          if [ -n "$failed" ]; then
            echo "::error::publish failed for:$failed"
            exit 1
          fi
