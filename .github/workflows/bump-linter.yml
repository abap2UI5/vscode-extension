# The linter is a git dependency pinned to a commit in BOTH manifests, so a
# new finding type is invisible in the editor until the pin moves (see
# AGENTS.md, "Toolchain & supply chain"). This workflow moves it: once a week
# it re-resolves the dependency against the linter's main, runs the full
# gate, and opens a PR with the change - the human review stays, the
# remembering-to-do-it goes away.
#
# The mechanics live in bump-snapshot.yml, shared with the three snapshot
# bumps. This file is the part that is specific to the linter pin.

name: Bump linter

on:
  schedule:
    # Mondays 06:17 UTC - an odd minute, off the full-hour load spikes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: ./.github/workflows/bump-snapshot.yml
    # BUMP_PR_TOKEN is read by the reusable workflow; without `inherit` it
    # would not be visible there and every PR would silently fall back to the
    # default token.
    secrets: inherit
    with:
      label: the pinned abap2UI5-linter commit
      # This one re-resolves the linter's full tree (all @openui5/* packages
      # plus playwright) as well as building the vsix and the web suite.
      timeout-minutes: 45
      # `npm install` above has already populated node_modules with the newly
      # resolved tree; an `npm ci` would reinstall from the lockfile and is
      # simply wasted time here.
      needs-npm-ci: false
      paths: |
        package.json
        package-lock.json
      # Re-resolve the git dependency. The SHA lives in BOTH manifests - the
      # spec in package.json carries `#<sha>` so a plain `npm install` cannot
      # drift to whatever main happens to be, and package-lock.json records
      # the same commit for `npm ci`. `npm install` rewrites the spec to the
      # bare form, so it is written back explicitly here; both files then move
      # together, and both are committed.
      regenerate: |
        npm install @abap2ui5/linter@github:abap2UI5/linter
        sha=$(node -p "
          const l = require('./package-lock.json');
          const k = Object.keys(l.packages).find(k => k.endsWith('@abap2ui5/linter'));
          l.packages[k].resolved.replace(/^.*#/, '')
        ")
        node -e "
          const fs = require('fs');
          const t = fs.readFileSync('package.json', 'utf8');
          fs.writeFileSync('package.json', t.replace(
            /(\"@abap2ui5\/linter\": \"github:abap2UI5\/linter)(#[0-9a-f]{40})?\"/,
            '\$1#$sha\"'));
        "
        node -e "require('./package.json')"   # it still has to parse
      branch: bump-linter
      title: "chore: bump the pinned abap2UI5-linter commit"
      body: |
        Weekly re-resolve of the `@abap2ui5/linter` git dependency against
        the linter's main. New rules, fixes and metadata land in the
        editor only when this pin moves.

        Read the diff before merging: both manifests have to name the same
        commit, and a new rule can turn a clean workspace red for everyone
        using the extension.
