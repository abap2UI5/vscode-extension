name: CI

on:
  push:
    branches: [main]
  pull_request:

# This job builds and tests; it writes nothing back. Without this block the
# run gets whatever the repository default is, which is read/write in plenty
# of organisations - a token far beyond what `npm ci && npm test` needs, handed
# to every dependency in the tree.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The bundled linter declares engines >= 22; npm only warns today,
          # but there is no reason for CI to build on a version the toolchain
          # says it does not support.
          node-version: 22
          cache: npm

      - run: npm ci

      # Same four commands AGENTS.md asks for before pushing.
      # lint = tsc --noEmit + eslint (config in eslint.config.mjs).
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - run: npm run vsix

      # The web bundle, activated in a real (headless) browser extension
      # host - the one thing the node-based suite cannot prove. Downloads
      # VS Code web and drives the playwright chromium fetched during
      # npm ci, so it runs here and not in the sandboxed pre-push loop.
      - run: npm run test:web

      # The .vsix of every branch, installable straight from the run page.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
